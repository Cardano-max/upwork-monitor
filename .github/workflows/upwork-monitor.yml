name: Upwork Job Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Restore cookies and seen jobs
        uses: actions/cache@v4
        with:
          path: |
            seen_jobs.json
          key: upwork-seen-jobs-v1
      - name: Decode cookies from secret
        env:
          UPWORK_COOKIES_B64: ${{ secrets.UPWORK_COOKIES_B64 }}
        run: echo "$UPWORK_COOKIES_B64" | base64 -d > upwork_cookies.json
      - name: Run monitor (single check)
        env:
          SINGLE_RUN: "true"
          NTFY_TOPIC: "ateeb-upwork-2026"
        run: python3 monitor.py
      - name: Save seen jobs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_jobs.json
          key: upwork-seen-jobs-v1
